<header class="d-flex flex-column align-items-center pb-3 mb-5 border-bottom">
  <!-- Logo centré -->
  <img src="{{ site.github.url }}/assets/img/logoimt.jpg" alt="Logo IMT" style="height:80px; margin-bottom:10px;">

  <!-- Titre et description -->
  <div class="text-center">
    <a href="{{ site.github.url }}/" class="text-decoration-none d-block">
      <span class="fs-4 fw-bold">{{ site.title }}</span>
    </a>
    <a href="{{ site.github.url }}/" class="text-decoration-none d-block">
      <span style="font-size:0.9rem;">{{ site.description }}</span>
    </a>
  </div>

  <!-- Ligne séparatrice au-dessus du menu -->
  <hr style="width:100%; border-top:1px solid #ccc; margin:10px 0;">

  <!-- Menu -->
  <nav class="d-inline-flex mt-2">
    {% for item in site.data.settings.menu %}
      <a class="me-3 py-2 text-decoration-none" href="{{ site.github.url }}{{ item.url }}">{{ item.name }}</a>
    {% endfor %}
  </nav>
</header>
